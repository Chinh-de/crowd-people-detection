[project]
name = "crowd-demo"
version = "0.1.0"
description = "Demo giám sát đám đông: đếm người, khoanh vùng, phát hiện bất thường (chạy CPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "yt-dlp[default]>=2025.1.1",
    "deno>=2.0",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
crowd-demo = "crowd_demo.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_demo"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
